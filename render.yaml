services:
  - type: web
    name: khoa-luan-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # The WebSocket connection manager is in memory: use one worker.
    startCommand: python -m app.database.init_db && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DATABASE_URL
        fromDatabase:
          name: khoa-luan-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: khoa-luan-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: khoa_luan
    user: khoa_luan
